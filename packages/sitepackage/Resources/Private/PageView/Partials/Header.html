<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
    <div class="page-header{f:if(condition: files.0, then: ' page-header--has-image')}">
        <f:if condition="{files.0}">
            <div class="page-header-image">
                <f:image image="{files.0}" alt="{files.0.alternative}" title="{files.0.title}" />
            </div>
        </f:if>
        <div class="main-header">
            <f:render partial="Navigation/MainNav" arguments="{_all}" />
        </div>
    </div>
    </html>
